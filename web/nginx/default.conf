server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    # API -> backend (PWA aynı origin üzerinden /api kullanır)
    location /api/ {
        proxy_pass http://backend:4100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite hash'li bundle'lar uzun süre cache'lenebilir
    location ~* "\.(?:js|css)$" {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Logo / görseller: immutable yok (güncelleme görünsün)
    location ~* "\.(?:png|jpg|jpeg|gif|svg|ico|woff2|webmanifest)$" {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }
}
